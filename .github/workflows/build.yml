name: Build SKeen-Box binaries

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 */3 * *'

permissions:
  contents: read

concurrency:
  group: skeen-box-${{ github.ref }}
  cancel-in-progress: false

jobs:
  discover:
    name: Find upstream releases missing locally
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      has_versions: ${{ steps.select.outputs.has_versions }}
      versions: ${{ steps.select.outputs.versions }}
      matrix: ${{ steps.select.outputs.matrix }}
    steps:
      - name: Select latest stable and prerelease versions
        id: select
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail

          upstream_tags=$(gh api --paginate "repos/SagerNet/sing-box/releases?per_page=100" \
            --jq '.[] | select(.draft == false) | .tag_name')
          existing_tags=$(gh api --paginate "repos/${REPOSITORY}/releases?per_page=100" \
            --jq '.[].tag_name')

          latest_stable=""
          latest_prerelease=""
          while IFS= read -r tag; do
            if [[ -z "${latest_stable}" && "${tag}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              latest_stable="${tag}"
            elif [[ -z "${latest_prerelease}" && "${tag}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-(alpha|beta|rc)([.-][0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
              latest_prerelease="${tag}"
            fi
            if [[ -n "${latest_stable}" && -n "${latest_prerelease}" ]]; then
              break
            fi
          done <<< "${upstream_tags}"

          versions=()
          for upstream_tag in "${latest_stable}" "${latest_prerelease}"; do
            [[ -n "${upstream_tag}" ]] || continue

            version="${upstream_tag#v}"
            version_core="${version%%+*}"
            if [[ "${version_core}" == *-* ]]; then
              release_version="${version_core%%-*}-skb-${version_core#*-}"
            else
              release_version="${version_core}-skb"
            fi
            if [[ "${version}" == *+* ]]; then
              release_version+="-${version#*+}"
            fi
            release_tag="v${release_version}"

            if grep -Fxq "${release_tag}" <<< "${existing_tags}"; then
              echo "${release_tag} already exists; skipping"
            else
              versions+=("${version}")
            fi
          done

          if (( ${#versions[@]} == 0 )); then
            echo "No new stable or alpha releases to build"
            echo "has_versions=false" >> "${GITHUB_OUTPUT}"
            echo 'versions=["none"]' >> "${GITHUB_OUTPUT}"
            echo 'matrix={"include":[{"version":"none","arch":"arm64","naive":false,"upx":false}]}' \
              >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          versions_json=$(printf '%s\n' "${versions[@]}" | jq -R . | jq -sc .)
          matrix_json=$(jq -cn --argjson versions "${versions_json}" '
            {include: [
              $versions[] as $version |
              {version: $version, arch: "arm64", variant: "musl", naive: true, upx: true},
              {version: $version, arch: "arm64", upx: true},
              {version: $version, arch: "mipsle", gomips: "softfloat", variant: "musl", naive: true, upx: true},
              {version: $version, arch: "mipsle", gomips: "softfloat", upx: true},
              {version: $version, arch: "mips", gomips: "softfloat", upx: true}
            ]}
          ')

          echo "has_versions=true" >> "${GITHUB_OUTPUT}"
          echo "versions=${versions_json}" >> "${GITHUB_OUTPUT}"
          echo "matrix=${matrix_json}" >> "${GITHUB_OUTPUT}"

  build:
    name: Build ${{ matrix.version }} ${{ matrix.arch }}${{ matrix.naive && ' + Naive' || '' }}${{ matrix.upx && ' + UPX' || '' }} binary
    needs: [discover]
    if: needs.discover.outputs.has_versions == 'true'
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    env:
      BUILD_TAGS: "with_gvisor,with_quic,with_utls,with_clash_api,badlinkname,tfogo_checklinkname0"
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix: ${{ fromJSON(needs.discover.outputs.matrix) }}
    steps:
      - name: Checkout workflow repository
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Checkout upstream sing-box tag
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5
        with:
          repository: SagerNet/sing-box
          ref: v${{ matrix.version }}
          path: sing-box
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: 1.27.4
          cache: false

      - name: Cache Go modules
        uses: actions/cache/restore@v4
        with:
          path: ~/go/pkg/mod
          key: go-mod-linux-${{ hashFiles('sing-box/go.sum') }}
          restore-keys: go-mod-linux-

      - name: Clone cronet-go
        if: matrix.naive
        run: |
          set -xeuo pipefail
          CRONET_GO_VERSION=$(cat sing-box/.github/CRONET_GO_VERSION)
          git init ~/cronet-go
          git -C ~/cronet-go remote add origin https://github.com/sagernet/cronet-go.git
          git -C ~/cronet-go sparse-checkout set --no-cone '/*' '!/lib'
          git -C ~/cronet-go fetch --depth=1 --filter=blob:none origin "$CRONET_GO_VERSION"
          git -C ~/cronet-go checkout FETCH_HEAD
          git -C ~/cronet-go submodule update --init --recursive --depth=1

      - name: Regenerate Debian keyring
        if: matrix.naive
        run: |
          set -xeuo pipefail
          rm -f ~/cronet-go/naiveproxy/src/build/linux/sysroot_scripts/keyring.gpg
          cd ~/cronet-go
          GPG_TTY=/dev/null ./naiveproxy/src/build/linux/sysroot_scripts/generate_keyring.sh

      - name: Download Chromium toolchain
        if: matrix.naive
        run: |
          set -xeuo pipefail
          cd ~/cronet-go
          go run ./cmd/build-naive --target=linux/${{ matrix.arch }} --libc=musl download-toolchain

      - name: Set Chromium toolchain environment
        if: matrix.naive
        run: |
          set -xeuo pipefail
          cd ~/cronet-go
          go run ./cmd/build-naive --target=linux/${{ matrix.arch }} --libc=musl env >> "$GITHUB_ENV"

      - name: Set target build tags
        env:
          VERSION: ${{ matrix.version }}
        run: |
          set -xeuo pipefail
          TAGS="${BUILD_TAGS}"
          VERSION_CORE="${VERSION%%+*}"
          if [[ ! "${VERSION_CORE}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            TAGS=",${TAGS},"
            TAGS="${TAGS/,with_gvisor,/}"
            TAGS="${TAGS#,}"
            TAGS="${TAGS%,}"
          fi
          if [[ "${{ matrix.naive }}" == "true" ]]; then
            case ",${TAGS}," in
              *,with_naive_outbound,*) ;;
              *) TAGS="${TAGS},with_naive_outbound" ;;
            esac
          fi
          if [[ "${{ matrix.variant }}" == "musl" ]]; then
            TAGS="${TAGS},with_musl"
          fi
          echo "BUILD_TAGS=${TAGS}" >> "$GITHUB_ENV"
          echo "LDFLAGS_SHARED=$(cat sing-box/release/LDFLAGS)" >> "$GITHUB_ENV"

      - name: Install UPX
        if: matrix.upx
        run: |
          set -xeuo pipefail
          UPX_VERSION=5.2.1
          UPX_ARCHIVE="upx-${UPX_VERSION}-amd64_linux.tar.xz"
          curl -fsSL "https://github.com/upx/upx/releases/download/v${UPX_VERSION}/${UPX_ARCHIVE}" -o "$RUNNER_TEMP/${UPX_ARCHIVE}"
          tar -xJf "$RUNNER_TEMP/${UPX_ARCHIVE}" -C "$RUNNER_TEMP"
          sudo install -m 755 "$RUNNER_TEMP/upx-${UPX_VERSION}-amd64_linux/upx" /usr/local/bin/upx

      - name: Build binary
        working-directory: sing-box
        run: |
          set -xeuo pipefail
          mkdir -p ../dist

          VERSION_CORE="${VERSION%%+*}"
          if [[ "${VERSION_CORE}" == *-* ]]; then
            BUILD_VERSION="${VERSION_CORE%%-*}-skb-${VERSION_CORE#*-}"
          else
            BUILD_VERSION="${VERSION_CORE}-skb"
          fi
          if [[ "${VERSION}" == *+* ]]; then
            BUILD_VERSION+="-${VERSION#*+}"
          fi
          BINARY_NAME="sing-box_${BUILD_VERSION}_linux_${GOARCH}"

          if [[ "${{ matrix.naive }}" == "true" ]]; then
            BINARY_NAME="${BINARY_NAME}_naive"
          fi

          go build -v -trimpath -o "../dist/${BINARY_NAME}" -tags "${BUILD_TAGS}" \
            -ldflags "-X 'github.com/sagernet/sing-box/constant.Version=${BUILD_VERSION}' ${LDFLAGS_SHARED} -s -w -buildid=" \
            ./cmd/sing-box

          if [[ "${UPX_VARIANT}" == "true" ]]; then
            UPX_BINARY="../dist/${BINARY_NAME}_upx"
            cp "../dist/${BINARY_NAME}" "$UPX_BINARY"

            if upx -5 --no-lzma "$UPX_BINARY"; then
              echo "UPX compression succeeded with -5 --no-lzma"
            else
              echo "::warning::UPX output failed verification at all compression levels; publishing the original binary only"
              rm -f "$UPX_BINARY"
            fi
          fi
        env:
          CGO_ENABLED: ${{ matrix.naive && '1' || '0' }}
          GOOS: linux
          GOARCH: ${{ matrix.arch }}
          GOMIPS: ${{ matrix.gomips }}
          VERSION: ${{ matrix.version }}
          VARIANT: ${{ matrix.variant }}
          UPX_VARIANT: ${{ matrix.upx }}
          GITHUB_TOKEN: ${{ github.token }}

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: sing-box-${{ matrix.version }}-${{ matrix.arch }}${{ matrix.naive && '-naive' || '' }}
          path: dist/sing-box_*
          if-no-files-found: error
          compression-level: 0

  release:
    name: Publish ${{ matrix.version }} release
    runs-on: ubuntu-latest
    needs: [discover, build]
    if: needs.discover.outputs.has_versions == 'true'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.discover.outputs.versions) }}
    permissions:
      contents: write
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Download all binary artifacts
        uses: actions/download-artifact@v5
        with:
          pattern: sing-box-${{ matrix.version }}-*
          path: dist
          merge-multiple: true

      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ matrix.version }}
          RELEASE_NOTES: |
            sing-box binaries for Keenetic routers.

            Build tags:
            - Common: COMMON_BUILD_TAGS
            - Naive variants (ARM64 and MIPS little-endian): additionally use `with_naive_outbound` and `with_musl`

            UPX-compressed variants use the `_upx` suffix.

            ---

            Бинарные файлы sing-box для роутеров Keenetic.

            Теги сборки:
            - Общие: COMMON_BUILD_TAGS
            - Варианты Naive (ARM64 и MIPS little-endian): дополнительно используют `with_naive_outbound` и `with_musl`

            Сжатые UPX варианты имеют суффикс `_upx`.
        run: |
          set -xeuo pipefail
          shopt -s nullglob
          VERSION_CORE="${VERSION%%+*}"
          if [[ "${VERSION_CORE}" == *-* ]]; then
            release_version="${VERSION_CORE%%-*}-skb-${VERSION_CORE#*-}"
          else
            release_version="${VERSION_CORE}-skb"
          fi
          if [[ "${VERSION}" == *+* ]]; then
            release_version+="-${VERSION#*+}"
          fi
          binaries=(dist/sing-box_${release_version}_*)
          if (( ${#binaries[@]} == 0 )); then
            echo "No Keenetic binaries were downloaded" >&2
            exit 1
          fi

          IFS=$'\n' binaries=($(printf '%s\n' "${binaries[@]}" |
            awk '
              /linux_arm64/  { print "1\t" $0; next }
              /linux_mipsle/ { print "2\t" $0; next }
              /linux_mips/   { print "3\t" $0; next }
              { print "9\t" $0 }
            ' | sort -t "$(printf '\t')" -k1,1n -k2 | cut -f2-))
          unset IFS

          tag="v${release_version}"
          is_prerelease=false
          VERSION_CORE="${VERSION%%+*}"
          if [[ ! "${VERSION_CORE}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            is_prerelease=true
          fi
          common_build_tags='`with_quic`, `with_utls`, `with_clash_api`, `badlinkname`, `tfogo_checklinkname0`'
          if [[ "${is_prerelease}" != "true" ]]; then
            common_build_tags="\`with_gvisor\`, ${common_build_tags}"
          fi
          RELEASE_NOTES="${RELEASE_NOTES//COMMON_BUILD_TAGS/${common_build_tags}}"

          if gh release view "$tag" >/dev/null 2>&1; then
            release_id=$(gh release view "$tag" --json databaseId --jq .databaseId)
            gh api "repos/${GITHUB_REPOSITORY}/releases/${release_id}" \
              --method PATCH \
              -F "name=${release_version}" \
              -F "body=${RELEASE_NOTES}" \
              -F "prerelease=${is_prerelease}"
            gh release upload "$tag" "${binaries[@]}" --clobber
          else
            release_flags=(
              --title "${release_version}"
              --notes "$RELEASE_NOTES"
              --target "$GITHUB_SHA"
            )
            if [[ "$is_prerelease" == "true" ]]; then
              release_flags+=(--prerelease)
            fi
            gh release create "$tag" "${binaries[@]}" "${release_flags[@]}"
          fi
